# Bundle layer for @brambledd/bramble-memory: inserts the five plugin rows.
# Zero-config: every plugin falls back to ~/.dsh/memory defaults. Override
# any of them through your profile patch by id. dsh-memory-capture needs the
# host `llm` service; it stays idle when that service is absent.
- insert:
    - id: dsh-memory-core
      name: "@brambledd/bramble-memory/plugins/core"
    - id: dsh-memory-decisions
      name: "@brambledd/bramble-memory/plugins/decisions"
    - id: dsh-memory-lessons
      name: "@brambledd/bramble-memory/plugins/lessons"
    - id: dsh-memory-events
      name: "@brambledd/bramble-memory/plugins/events"
    - id: dsh-memory-capture
      name: "@brambledd/bramble-memory/plugins/capture"
      config:
        autoCapture: true
        everyNTurns: 8
        maxFactsPerPass: 6
        dailyMax: 40
